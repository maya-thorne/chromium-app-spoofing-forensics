title: Proc Creation Win Chromium App Programdata
id: casf-sigma-defe-019
status: production
description: Detects Chromium app mode loading HTML placed in ProgramData.
references:
    - https://github.com/maya-thorne/chromium-app-spoofing-forensics
author: Maya Thorne (Systems & Security Research)
date: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1036_005
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
    selection_flags:
        CommandLine|contains:
            - '--app='
    condition: selection_image and selection_flags
falsepositives:
    - Legitimate enterprise Progressive Web Apps (PWAs) deployed via Microsoft Intune or Chrome Enterprise.
level: high
