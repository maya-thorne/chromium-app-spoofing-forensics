title: Registry Set Win Run Key App Mode
id: casf-sigma-pers-047
status: production
description: Detects Run or RunOnce key configured with browser --app parameter.
references:
    - https://github.com/maya-thorne/chromium-app-spoofing-forensics
author: Maya Thorne (Systems & Security Research)
date: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1547_001
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
    selection_flags:
        CommandLine|contains:
            - '--app='
    condition: selection_image and selection_flags
falsepositives:
    - Legitimate enterprise Progressive Web Apps (PWAs) deployed via Microsoft Intune or Chrome Enterprise.
level: critical
