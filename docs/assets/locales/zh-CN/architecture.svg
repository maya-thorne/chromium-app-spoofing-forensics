<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" rx="16" fill="url(#archBg)"/>
  <rect x="1" y="1" width="1198" height="618" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="50" y="50" fill="url(#neonTitle)" font-family="ui-monospace, monospace" font-size="22" font-weight="900" text-rendering="geometricPrecision">
    CHROMIUM 应用伪装取证系统架构
  </text>
  <text x="50" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-rendering="geometricPrecision">
    静态分流 · LNK 二进制提取 · 窗口层级审计 · 协议防御
  </text>

  <!-- 4 Columns (Card Width = 250px) -->

  <!-- Column 1 -->
  <g transform="translate(50, 110)">
    <rect width="250" height="460" rx="10" fill="#0b132b" stroke="#38bdf8" stroke-width="1.3"/>
    <text x="18" y="32" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">1. LNK 伪造取证</text>
    <text x="18" y="52" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10.5">[MS-SHLLINK] 提取</text>
    <line x1="18" y1="64" x2="232" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Module 1.1 -->
    <rect x="18" y="80" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">标头与 CLSID 解析</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">76字节 ShellLinkHeader</text>
    <text x="28" y="138" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">LinkCLSID 与标志审计</text>

    <!-- Module 1.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">StringData 提取器</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">命令行参数提取</text>
    <text x="28" y="228" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5">--app= 与 -incognito</text>

    <!-- Module 1.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">图标位置审计</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">HasIconLocation 提取</text>
    <text x="28" y="318" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">Teams/Office 图标伪装</text>

    <!-- Status Box -->
    <rect x="18" y="390" width="214" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="418" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">状态: LNK 解析完成</text>
  </g>

  <!-- Column 2 -->
  <g transform="translate(330, 110)">
    <rect width="250" height="460" rx="10" fill="#0b132b" stroke="#818cf8" stroke-width="1.3"/>
    <text x="18" y="32" fill="#818cf8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">2. 运行时遥测</text>
    <text x="18" y="52" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="10.5">CLI 与进程树</text>
    <line x1="18" y1="64" x2="232" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Module 2.1 -->
    <rect x="18" y="80" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">参数组合矩阵</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">--app= 结合 -incognito</text>
    <text x="28" y="138" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9.5">会话隔离与缓存规避</text>

    <!-- Module 2.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">窗口尺寸检测器</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">--window-size=440,520</text>
    <text x="28" y="228" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9.5">登录弹窗尺寸模仿</text>

    <!-- Module 2.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">父子进程审计</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">脚本解释器父进程</text>
    <text x="28" y="318" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">PowerShell/CMD 启动浏览器</text>

    <!-- Status Box -->
    <rect x="18" y="390" width="214" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="418" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">状态: CLI 异常已确认</text>
  </g>

  <!-- Column 3 -->
  <g transform="translate(610, 110)">
    <rect width="250" height="460" rx="10" fill="#0b132b" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="18" y="32" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="13" font-weight="700">3. 窗口层级结构</text>
    <text x="18" y="52" fill="#fde68a" font-family="ui-monospace, monospace" font-size="10.5">类与进程名审计</text>
    <line x1="18" y1="64" x2="232" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Module 3.1 -->
    <rect x="18" y="80" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">标题进程不匹配</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">声称身份验证</text>
    <text x="28" y="138" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">浏览器中的 Teams 标题</text>

    <!-- Module 3.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Win32 窗口类</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Chrome_WidgetWin_1</text>
    <text x="28" y="228" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">浏览器 UI 完全缺失</text>

    <!-- Module 3.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">原生封装器提取</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">WebView2 / CefSharp .NET</text>
    <text x="28" y="318" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">临时目录封装程序</text>

    <!-- Status Box -->
    <rect x="18" y="390" width="214" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="418" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">状态: 窗口审计完成</text>
  </g>

  <!-- Column 4 -->
  <g transform="translate(890, 110)">
    <rect width="250" height="460" rx="10" fill="#0b132b" stroke="#10b981" stroke-width="1.3"/>
    <text x="18" y="32" fill="#10b981" font-family="ui-monospace, monospace" font-size="13" font-weight="700">4. 协议与防御</text>
    <text x="18" y="52" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10.5">规则与源绑定</text>
    <line x1="18" y1="64" x2="232" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Module 4.1 -->
    <rect x="18" y="80" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">52 条 Sigma 规则</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Sysmon EID 1, 11 与 4688</text>
    <text x="28" y="138" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">防御规避与执行阻断</text>

    <!-- Module 4.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">32 条 YARA 特征</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">二进制 LNK 与 HTML DOM</text>
    <text x="28" y="228" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">伪造地址栏特征码</text>

    <!-- Module 4.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">密码学防御体系</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">FIDO2 / WebAuthn 源绑定</text>
    <text x="28" y="318" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">强制源绑定校验</text>

    <!-- Status Box -->
    <rect x="18" y="390" width="214" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="418" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">状态: 防御就绪</text>
  </g>
</svg>
