    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">--app= con -incognito</text>
    <text x="28" y="138" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9.5">Evasión de Aislamiento de Sesión</text>

    <!-- Module 2.2 -->
