    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">--window-size=440,520</text>
    <text x="28" y="228" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9.5">Imitación de Modal de Acceso</text>

    <!-- Module 2.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Auditor de Padre-Hijo</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Padres de Intérprete de Scripts</text>
    <text x="28" y="318" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">PowerShell/CMD a Navegador</text>

