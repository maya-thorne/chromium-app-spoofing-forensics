    <text x="18" y="32" fill="#10b981" font-family="ui-monospace, monospace" font-size="13" font-weight="700">4. PROTOCOLOS Y DEFENSA</text>
    <text x="18" y="52" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10.5">Reglas y Vinculación de Origen</text>
    <line x1="18" y1="64" x2="232" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Module 4.1 -->
    <rect x="18" y="80" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">52 Reglas Sigma</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Sysmon EID 1, 11 y 4688</text>
    <text x="28" y="138" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">Evasión de Defensa y Ejecución</text>

    <!-- Module 4.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">32 Firmas YARA</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">LNK Binario y DOM HTML</text>
    <text x="28" y="228" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">Firmas de Barra Falsa</text>

    <!-- Module 4.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Defensa Criptográfica</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Origen FIDO2 / WebAuthn</text>
    <text x="28" y="318" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">Aplicación de Origin-Binding</text>

    <!-- Status Box -->
    <rect x="18" y="390" width="214" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="418" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ESTADO: DEFENSA_LISTA</text>
  </g>
