    <text x="28" y="104" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Discordancia Título-Proceso</text>
    <text x="28" y="122" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Auditoría de Identidad Declarada</text>
    <text x="28" y="138" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">Título Teams en Navegador</text>

    <!-- Module 3.2 -->
    <rect x="18" y="170" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="194" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Clase de Ventana Win32</text>
    <text x="28" y="212" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Chrome_WidgetWin_1</text>
    <text x="28" y="228" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="9.5">Ausencia de Controles de Navegador</text>

    <!-- Module 3.3 -->
    <rect x="18" y="260" width="214" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="28" y="284" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Extracción de Envoltorios</text>
    <text x="28" y="302" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">WebView2 / CefSharp .NET</text>
    <text x="28" y="318" fill="#10b981" font-family="ui-monospace, monospace" font-size="9.5">Envoltorios en Carpeta Temp</text>

    <!-- Status Box -->
    <rect x="18" y="390" width="214" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="418" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ESTADO: VENTANA_AUDITADA</text>
