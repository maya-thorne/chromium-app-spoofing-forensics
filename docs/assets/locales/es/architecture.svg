    <rect x="18" y="390" width="214" height="45" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1"/>
    <text x="28" y="418" fill="#4ade80" font-family="ui-monospace, monospace" font-size="11" font-weight="700">ESTADO: ANOMALÍA_CLI_OK</text>
